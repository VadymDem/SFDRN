version: '3.8'

services:
  sfdrn-node:
    build:
      context: .
      dockerfile: Dockerfile
    image: sfdrn:latest
    container_name: sfdrn-${NODE_NAME:-node}
    environment:
      - NODE_ID=${NODE_ID}
      - REGION=${REGION}
      - PUBLIC_ENDPOINT=${PUBLIC_ENDPOINT}
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - BOOTSTRAP_NODES=${BOOTSTRAP_NODES}
      - DB_PATH=/app/data
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      # SQLite database persistence
      - sfdrn-data:/app/data
      # Optional: backup directory
      - ${BACKUP_DIR:-./backups}:/app/backups:ro
    restart: unless-stopped
    networks:
      - sfdrn-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/mesh/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sfdrn-data:
    driver: local

networks:
  sfdrn-net:
    driver: bridge